<!doctype html><html><head><meta charset="utf-8"><style>

.lilly-hero {
  position: relative;
  border-radius: var(--radius-lg);
  padding: 40px 44px;
  background:
    radial-gradient(900px 400px at 80% 0%, rgba(109,40,217,0.28), transparent 60%),
    radial-gradient(700px 360px at 12% 100%, rgba(255,111,174,0.16), transparent 60%),
    linear-gradient(135deg, #13101A, #0d0a15);
  border: 1px solid rgba(109,40,217,0.35);
  box-shadow: 0 0 50px rgba(109,40,217,0.18);
  overflow: hidden;
}
.lilly-hero h1 {
  font-family: var(--font-elegant);
  font-weight: 700;
  font-size: clamp(44px, 8vw, 104px);
  letter-spacing: 0.22em;
  margin: 0;
  text-align: center;
  line-height: 1.05;
}
.hero-name-glow {
  display: inline-block;
  background: linear-gradient(135deg, #FFE9A8 0%, #D4AF37 38%, #FF6FAE 64%, #8B5CF6 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 26px rgba(255,215,120,0.45), 0 0 60px rgba(109,40,217,0.35);
  filter: drop-shadow(0 0 14px rgba(212,175,55,0.4));
  animation: heroGlow 6s ease-in-out infinite;
}
@keyframes heroGlow {
  0%,100% { filter: drop-shadow(0 0 14px rgba(212,175,55,0.35)); }
.hero-flourish {
  text-align: center;
  font-size: 18px;
  letter-spacing: 0.5em;
  color: var(--gold, #D4AF37);
  opacity: 0.8;
  margin-bottom: 6px;
  text-shadow: 0 0 16px rgba(212,175,55,0.5);
}
.lilly-hero .lilly-sub {
  font-family: var(--font-main);
  letter-spacing: 0.42em;
  text-transform: uppercase;
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 10px;
}
.lilly-hero .lilly-portrait {
  width: 128px; height: 128px; border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(212,175,55,0.7);
  box-shadow: 0 0 40px rgba(109,40,217,0.55), 0 0 22px rgba(212,175,55,0.4);
}
.lilly-hero-medallion {
  position: relative;
  width: 148px; height: 148px;
  display: grid; place-items: center;
}
.lilly-hero-medallion .medallion-ring {
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 2px solid rgba(212,175,55,0.55);
  box-shadow: 0 0 30px rgba(212,175,55,0.45), inset 0 0 24px rgba(109,40,217,0.4);
  animation: medallionSpin 14s linear infinite;
}
.lilly-hero-medallion .medallion-ring::before {
  content: "✦";
  position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
  color: var(--gold, #D4AF37); font-size: 16px;
  text-shadow: 0 0 12px rgba(212,175,55,0.8);
}
@keyframes medallionSpin {
  from { transform: rotate(0deg); }
.lilly-hero-inner {
  display: flex; align-items: center; justify-content: center; gap: 36px;
  flex-wrap: wrap;
}
.lilly-hero-text { flex: 1 1 320px; min-width: 280px; display: flex; flex-direction: column; align-items: center; }
.lilly-tagline {
  margin-top: 14px; max-width: 560px; text-align: center;
  color: var(--text-secondary); font-size: 14px; line-height: 1.7;
}
/* page backdrop so the hero reads correctly */
body { margin:0; background: radial-gradient(900px 500px at 80% 0%, rgba(109,40,217,0.25), transparent 60%), #0d0a15; min-height:100vh; padding:40px; font-family: system-ui, sans-serif; }
</style></head><body>
